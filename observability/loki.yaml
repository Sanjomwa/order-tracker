# Single-binary Loki, filesystem storage, 2-day retention.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 48h
  allow_structured_metadata: true   # required for OTLP ingestion
  volume_enabled: true
  otlp_config:
    resource_attributes:
      attributes_config:
        # Index these resource attributes as labels so logs can be filtered by
        # environment and version (service.name is indexed by default).
        - action: index_label
          attributes:
            - service.version
            - deployment.environment.name

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
